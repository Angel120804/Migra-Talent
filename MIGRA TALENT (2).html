<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIGRA TALENT · International Talent Passport</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
:root{--bg:#F6F8FA;--card:#fff;--ink:#0D3B66;--muted:#4F6378;--line:#DDE3EA;--teal:#14B8A6;--teal2:#2EC4B6;--sun:#F4B400;--red:#EF5350;--grey:#E5E7EB;--btn:#0D3B66;--onbtn:#fff;--tealtx:#0B7F73;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08213A;--card:#0F2D4D;--ink:#EAF2FA;--muted:#A9BDD1;--line:#21476E;--btn:#2EC4B6;--onbtn:#08213A;--tealtx:#2EC4B6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#08213A;--card:#0F2D4D;--ink:#EAF2FA;--muted:#A9BDD1;--line:#21476E;--btn:#2EC4B6;--onbtn:#08213A;--tealtx:#2EC4B6;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 "Nunito Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Outfit,"Nunito Sans",system-ui,sans-serif;margin:0;line-height:1.12;letter-spacing:-.015em}
h2{font-size:1.9rem;margin-bottom:1rem}h3{font-size:1.15rem}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 1.1rem}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding-top:.6rem;padding-bottom:.6rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.6rem;font:800 1.1rem Outfit,sans-serif;cursor:pointer;background:none;border:0;color:var(--ink);padding:0}
.brand img{height:40px;background:#fff;border-radius:8px;padding:2px}
.brand b{color:var(--tealtx)}
nav{display:flex;gap:.3rem;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--muted);font:600 .95rem "Nunito Sans";padding:.5rem .8rem;border-radius:8px;cursor:pointer}
nav button[aria-current=true]{background:var(--btn);color:var(--onbtn)}
main{padding:2rem 0 3rem}
.btn{background:var(--btn);color:var(--onbtn);border:0;border-radius:9px;padding:.65rem 1.1rem;font:700 .95rem "Nunito Sans";cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:.4rem .8rem;font-size:.88rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.2rem;margin-bottom:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:center;margin-bottom:2.5rem}
@media(max-width:800px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(2.1rem,5vw,3.3rem);font-weight:800}
.hero p{color:var(--muted);font-size:1.1rem}
.plate{background:#fff;border-radius:20px;padding:1rem;display:flex;justify-content:center;border:1px solid var(--line)}
.plate img{max-width:100%;height:auto;max-height:300px}
.role{cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.role:hover{border-color:var(--teal)}
.role h3{margin-bottom:.3rem}.role p{margin:0;color:var(--muted);font-size:.95rem}
.muted{color:var(--muted)}
.bar{display:flex;gap:.8rem;align-items:flex-end;flex-wrap:wrap;margin-bottom:1rem}
label{font-weight:600;font-size:.92rem;display:block}
input[type=text],input[type=number],select,textarea{display:block;margin-top:.25rem;padding:.55rem .7rem;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;min-width:200px;max-width:100%}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.8rem;margin-bottom:.8rem}
fieldset{border:0;padding:0;margin:0 0 .8rem}legend{font-weight:700;font-size:.92rem;margin-bottom:.3rem}
.chk{display:inline-flex;align-items:center;gap:.35rem;border:1.5px solid var(--line);border-radius:99px;padding:.2rem .75rem;margin:0 .3rem .4rem 0;font-weight:600;font-size:.88rem;cursor:pointer}
.chk input{accent-color:var(--teal)}
.tags span{display:inline-block;background:var(--grey);color:#0D3B66;border-radius:99px;padding:.05rem .65rem;font-size:.82rem;font-weight:600;margin:0 .3rem .3rem 0}
.badge{display:inline-block;border-radius:99px;padding:.1rem .7rem;font-size:.82rem;font-weight:700}
.ok{background:#CFF5EF;color:#0A5F56}.wait{background:#FFEFC2;color:#7A5900}.fin{background:#DCE8F5;color:#0D3B66}
.row{display:flex;justify-content:space-between;gap:1rem;align-items:center;flex-wrap:wrap;padding:.7rem 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.score{font:800 1.7rem Outfit,sans-serif;color:var(--tealtx);line-height:1}
.mt{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start}
ul.why{margin:.4rem 0 0;padding-left:1.1rem;color:var(--muted);font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:1rem}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem}
.stats b{display:block;font:800 2rem Outfit,sans-serif;color:var(--tealtx)}
.pp{background:#0D3B66;color:#fff;border-radius:18px;padding:1.5rem;border-top:8px solid var(--sun)}
.pp h2{margin:0 0 .2rem}.pp .muted{color:#B9CCE0}
.meter{display:grid;grid-template-columns:11rem 1fr 2.2rem;gap:.6rem;align-items:center;font-size:.92rem;margin:.35rem 0}
.meter i{display:block;height:10px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden}
.meter i u{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--sun))}
@media(max-width:560px){.meter{grid-template-columns:7.5rem 1fr 2rem}}
.stamp{display:inline-block;border:3px solid var(--sun);color:var(--sun);border-radius:10px;padding:.2rem .8rem;font:800 .9rem Outfit;transform:rotate(-4deg)}
.how{counter-reset:s;list-style:none;padding:0;margin:1.2rem 0;display:grid;gap:.8rem}.how li{counter-increment:s;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem 1rem 3.6rem;position:relative}.how li::before{content:counter(s);position:absolute;left:1rem;top:.95rem;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--btn);color:var(--onbtn);display:grid;place-items:center;font:800 .95rem Outfit,sans-serif}.how h3{margin-bottom:.2rem}.how p{margin:0;color:var(--muted)}
footer{border-top:1px solid var(--line);padding:1.5rem 0 2.5rem;color:var(--muted);font-size:.9rem}
footer .wrap{display:flex;justify-content:space-between;gap:.8rem;flex-wrap:wrap;align-items:center}
@media print{header,footer,.noprint{display:none!important}body{background:#fff}}
</style>
</head>

const saveLocal=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const ready=(async()=>{
 try{
  if(window.claude&&claude.use){
   DB=await claude.use('db');
   try{const U=await claude.use('user');isOwner=!!(U&&U.isOwner())}catch(e){}
  }
 }catch(e){DB=null}
 if(DB){
  mode='compartido';
  COLS.forEach(c=>DB.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(d=>({...d.data(),id:d.id}));if(!$('#app form'))render()},()=>{mode='error de conexión';render()}));
 }else{
  mode='local';
  try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
 }
 render();
})();
async function put(c,o){
 try{await ready}catch(e){}
 const i=S[c].findIndex(x=>x.id===o.id);i<0?S[c].push(o):S[c][i]=o;
 if(DB){try{await DB.collection(c).doc(o.id).set(o)}catch(e){flash('No se pudo guardar: '+((e&&e.message)||'error'))}}else saveLocal();
}
async function wipe(){
 for(const c of COLS){
  if(DB){const sn=await DB.collection(c).get();for(const d of sn.docs)await DB.collection(c).doc(d.id).delete()}
  S[c]=[];
 }
 if(!DB)saveLocal();
 ui.sid=ui.cid=null;
}

/* ---------- Smart Matching ---------- */
const available=(s,j)=>j.mode==='Remoto'||norm(j.country)===norm(s.destCountry);
function match(s,j){
 const sk=j.skills.filter(x=>s.skills.includes(x)),lg=j.langs.filter(x=>s.langs.includes(x));
 const a=j.skills.length?sk.length/j.skills.length*50:0,b=j.langs.length?lg.length/j.langs.length*25:0;
 const c=s.months>=j.months?20:s.months/j.months*20;
 const city=j.mode!=='Remoto'&&norm(j.city)===norm(s.destCity);
 const why=[];
 if(sk.length)why.push('Habilidades en común: '+sk.join(', '));
 if(lg.length)why.push('Idiomas: '+lg.join(', '));
 why.push(s.months>=j.months?`La estadía (${s.months} meses) cubre los ${j.months} del proyecto`:`La estadía (${s.months} meses) es menor a los ${j.months} del proyecto`);
 why.push(j.mode==='Remoto'?'Modalidad remota: no depende de tu ciudad':city?`Está en tu ciudad de destino (${j.city})`:`Está en ${j.city}, en tu país de destino`);
 return{score:Math.round(a+b+c+(city?5:0)),why};
}

}

/* ---------- render y eventos ---------- */
const NAV=[['home','Inicio'],['how','Cómo funciona'],['student','Estudiante'],['company','Empresa'],['uni','Universidad'],['passport','Passport'],['model','Modelo']];
function render(){
 $('#nav').innerHTML=NAV.map(([k,l])=>`<button data-go="${k}" ${ui.view===k?'aria-current="true"':''}>${l}</button>`).join('');
 $('#app').innerHTML=({home:vHome,student:vStudent,company:vCompany,uni:vUni,passport:vPassport,model:vModel,how:vHow})[ui.view]();
 $('#mode').textContent=mode==='compartido'?'Datos compartidos en tiempo real':mode==='local'?'Modo local: los datos quedan solo en este navegador':mode==='conectando'?'Conectando…':'Error de conexión';
 $('#resetBtn').hidden=!isOwner;$('#resetBtn').textContent=confirmReset?'¿Seguro? Tocá de nuevo para borrar todo':'Borrar todos los datos';
}
document.addEventListener('click',async e=>{
 const g=e.target.closest('[data-go]');if(g){ui.view=g.dataset.go;ui.form=ui.coForm=ui.jobForm=ui.uniForm=false;ui.evalApp=null;render();scrollTo(0,0);return}
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
 if(a==='newS')ui.form=!ui.form;
 if(a==='newC')ui.coForm=!ui.coForm;
 if(a==='newU')ui.uniForm=!ui.uniForm;
 if(a==='newJ')ui.jobForm=!ui.jobForm;
 if(a==='evalOpen')ui.evalApp=id;
 if(a==='pdf'){await pdfPassport();return}
 if(a==='apply'){const s=cs();if(s)await put('apps',{id:uid('a'),jobId:id,studentId:s.id,status:'pendiente'})}
 if(a==='accept')await put('apps',{...S.apps.find(x=>x.id===id),status:'aceptada'});
 if(a==='validate')await put('students',{...stu(id),ok:true});
 if(a==='feat'){const j=job(id),c=cc();await put('jobs',{...j,featured:true});await put('payments',newPay('company',c.id,'Aviso destacado: '+j.title,PRICES.feat,j.id));flash('Aviso marcado como destacado. Falta confirmar el pago.')}
 if(a==='cancelPay'){const p=S.payments.find(x=>x.id===id);await put('payments',{...p,status:'cancelado'});if(p.jobId){const j=job(p.jobId);if(j)await put('jobs',{...j,featured:false})}flash('Pago cancelado.'+(p.jobId?' El aviso sigue publicado, sin destacar.':' Podés volver a pagar cuando quieras.'))}
 if(a==='repay'){const p=S.payments.find(x=>x.id===id);await put('payments',newPay(p.payerType,p.payerId,p.concept,PRICES.sub))}
 if(a==='reset'){if(!confirmReset){confirmReset=true;setTimeout(()=>{confirmReset=false;render()},6000);render();return}confirmReset=false;await wipe();flash('Se borraron todos los datos.')}
 render();
});
document.addEventListener('change',e=>{
 const s=e.target.dataset.sel;if(!s)return;ui[s]=e.target.value;render();
});
document.addEventListener('submit',async e=>{
 e.preventDefault();
 try{await onSubmit(e)}catch(err){flash('Error: '+((err&&err.message)||err))}
});
async function onSubmit(e){
 const f=e.target,d=new FormData(f),t=f.dataset.form,v=k=>(d.get(k)||'').toString().trim();
 const REQ={uni:{name:'Nombre',city:'Ciudad'},student:{nombres:'Nombres',apellidos:'Apellidos',uni:'Universidad de origen',career:'Carrera',destCity:'Ciudad de destino',hostId:'Universidad anfitriona'},company:{name:'Nombre',sector:'Rubro',city:'Ciudad',signer:'Responsable que firma',signerRole:'Cargo'},job:{title:'Título'}};
 const miss=Object.entries(REQ[t]||{}).filter(([k])=>!v(k)).map(([,l])=>l);
 if(miss.length){flash('Falta completar: '+miss.join(', '));return}
 if(t==='uni'){const n={id:uid('u'),name:v('name'),country:v('country'),city:v('city'),contact:v('contact')};await put('unis',n);await put('payments',newPay('uni',n.id,'Suscripción anual de universidad socia',PRICES.sub));ui.nid=n.id;ui.uniForm=false;flash('Universidad registrada: '+n.name+'. Falta confirmar el pago de la suscripción.')}
 if(t==='student'){const n={id:uid('s'),name:(v('nombres')+' '+v('apellidos')).trim(),nombres:v('nombres'),apellidos:v('apellidos'),country:v('country'),uni:v('uni'),career:v('career'),destCountry:v('destCountry'),destCity:v('destCity'),hostId:v('hostId'),months:+d.get('months'),langs:d.getAll('langs'),skills:d.getAll('skills'),ok:false};await put('students',n);ui.sid=n.id;ui.form=false;flash('Perfil creado. Queda pendiente de validación.')}
 if(t==='company'){const n={id:uid('c'),name:v('name'),sector:v('sector'),country:v('country'),city:v('city'),contact:v('contact'),signer:v('signer'),signerRole:v('signerRole')};await put('companies',n);ui.cid=n.id;ui.coForm=false;flash('Empresa registrada: '+n.name)}
 if(t==='job'){const c=cc(),pay=+d.get('pay')||0,cur=v('cur'),jid=uid('j');await put('jobs',{id:jid,companyId:c.id,country:c.country,city:c.city,title:v('title'),type:v('type'),mode:v('mode'),months:+d.get('months'),pay,cur,stipend:pay?`${fmt(pay)} ${cur} al mes`:'Sin apoyo económico',featured:!!d.get('featured'),skills:d.getAll('skills'),langs:d.getAll('langs')});if(d.get('featured'))await put('payments',newPay('company',c.id,'Aviso destacado: '+v('title'),PRICES.feat,jid));ui.jobForm=false;flash('Oportunidad publicada'+(d.get('featured')?'. Falta confirmar el pago del aviso destacado.':'.'))}
 if(t==='eval'){const a=S.apps.find(x=>x.id===f.dataset.id),j=job(a.jobId),r={};SOFT.concat(j.skills).forEach((c,i)=>r[c]=+d.get('r'+i));await put('apps',{...a,eval:{r,comment:v('comment')},evalDate:new Date().toISOString().slice(0,10),status:'finalizada'});ui.evalApp=null;flash('Evaluación guardada')}
 if(t==='pay'){const p=S.payments.find(x=>x.id===f.dataset.id);await put('payments',{...p,status:'pagado',method:v('method'),ref:'PAG-'+Math.random().toString(36).slice(2,8).toUpperCase(),paidAt:new Date().toISOString().slice(0,10)});flash('Pago registrado (simulado)')}
 render();
}
render();
</script>
</body>
</html>
